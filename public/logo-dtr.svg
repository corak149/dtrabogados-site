<?xml version="1.0" encoding="UTF-8"?>
<!-- Logo DTR — placeholder v3 (mejor aproximación al PNG oficial).
     Reemplazar con SVG oficial cuando llegue export del .ai. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" role="img" aria-label="DTR Abogados, Consultores y Asociados">
  <defs>
    <linearGradient id="goldMain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f2dda3"/>
      <stop offset="18%" stop-color="#e6c98a"/>
      <stop offset="55%" stop-color="#b8954a"/>
      <stop offset="88%" stop-color="#8a6d33"/>
      <stop offset="100%" stop-color="#6e5527"/>
    </linearGradient>
    <linearGradient id="goldSoft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e6c98a"/>
      <stop offset="100%" stop-color="#b8954a"/>
    </linearGradient>
  </defs>

  <!-- Fondo navy con doble marco -->
  <rect width="780" height="400" fill="#232a5e"/>
  <rect x="14" y="14" width="752" height="372" fill="none" stroke="#ffffff" stroke-width="6" opacity="0.9"/>
  <rect x="26" y="26" width="728" height="348" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.35"/>

  <!-- Balanza detallada -->
  <g transform="translate(150,205)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Punto de suspensión -->
    <circle cx="0" cy="-98" r="5" fill="url(#goldMain)"/>
    <!-- Poste vertical -->
    <line x1="0" y1="-98" x2="0" y2="72" stroke="url(#goldMain)" stroke-width="5"/>
    <!-- Brazo horizontal con detalle en extremos -->
    <line x1="-72" y1="-82" x2="72" y2="-82" stroke="url(#goldMain)" stroke-width="4"/>
    <circle cx="-72" cy="-82" r="3.5" fill="url(#goldMain)"/>
    <circle cx="72" cy="-82" r="3.5" fill="url(#goldMain)"/>
    <!-- Cuerdas izquierdas -->
    <line x1="-72" y1="-82" x2="-80" y2="-30" stroke="url(#goldSoft)" stroke-width="1.6"/>
    <line x1="-72" y1="-82" x2="-52" y2="-30" stroke="url(#goldSoft)" stroke-width="1.6"/>
    <!-- Cuerdas derechas -->
    <line x1="72" y1="-82" x2="80" y2="-30" stroke="url(#goldSoft)" stroke-width="1.6"/>
    <line x1="72" y1="-82" x2="52" y2="-30" stroke="url(#goldSoft)" stroke-width="1.6"/>
    <!-- Platillo izquierdo (elipse + curva copa) -->
    <ellipse cx="-66" cy="-28" rx="28" ry="5.5" fill="url(#goldMain)"/>
    <path d="M-94,-28 Q-66,10 -38,-28 Z" fill="url(#goldMain)"/>
    <!-- Platillo derecho -->
    <ellipse cx="66" cy="-28" rx="28" ry="5.5" fill="url(#goldMain)"/>
    <path d="M38,-28 Q66,10 94,-28 Z" fill="url(#goldMain)"/>
    <!-- Base -->
    <ellipse cx="0" cy="80" rx="44" ry="8" fill="url(#goldMain)"/>
    <ellipse cx="0" cy="72" rx="18" ry="4" fill="url(#goldMain)"/>
  </g>

  <!-- DTR — letras grandes con gradient dorado -->
  <text x="290" y="270" font-family="Georgia, 'Times New Roman', serif" font-size="200" font-weight="700" fill="url(#goldMain)" letter-spacing="10">DTR</text>

  <!-- Subtítulo -->
  <text x="390" y="350" font-family="'Source Sans 3', -apple-system, sans-serif" font-size="26" font-weight="400" fill="#ffffff" text-anchor="middle" letter-spacing="6">ABOGADOS, CONSULTORES Y ASOCIADOS</text>
</svg>
